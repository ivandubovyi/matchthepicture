<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Match The Animals</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            background: #f5f5f0;
            min-height: 100%;
            font-family: "Arial", sans-serif;
        }

        .wrap {
            position: relative;
            height: 100%;
            min-height: 500px;
            padding-bottom: 20px;
        }

        .game {
            transform-style: preserve-3d;
            perspective: 500px;
            min-height: 100%;
            height: 100%;
        }

        .card {
            float: left;
            width: 16.66666%;
            height: 25%;
            padding: 5px;
            text-align: center;
            display: block;
            perspective: 500px;
            position: relative;
            cursor: pointer;
            z-index: 50;
        }

        @media (max-width: 800px) {
            .card { width: 25%; height: 16.666%; }
        }

        .card .inside {
            width: 100%;
            height: 100%;
            display: block;
            transform-style: preserve-3d;
            transition: 0.4s ease-in-out;
            background: white;
        }

        .card .front,
        .card .back {
            border: 1px solid #ddd;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        .card .front {
            transform: rotateY(-180deg);
            padding: 0;
            overflow: hidden;
            background: #fff;
        }

        .card .front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card .back {
            background: #ffffff;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .card .back .back-label {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(14px, 2.5vw, 30px);
            font-weight: 700;
            color: #111;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-align: center;
        }

        @media (max-width: 800px) {
            .card .back .back-label { font-size: clamp(10px, 3.5vw, 18px); }
        }

        .card .inside.picked,
        .card .inside.matched {
            transform: rotateY(180deg);
        }

        @keyframes matchAnim {
            0% { background: #d4f5dd; }
            100% { background: white; }
        }
        @-webkit-keyframes matchAnim {
            0% { background: #d4f5dd; }
            100% { background: white; }
        }

        .card .inside.matched {
            -webkit-animation: 1s matchAnim ease-in-out;
            animation: 1s matchAnim ease-in-out;
            -webkit-animation-delay: 0.4s;
            animation-delay: 0.4s;
        }

        .modal-overlay {
            display: none;
            background: rgba(0,0,0,0.4);
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        .modal {
            display: none;
            position: relative;
            width: 1000px;
            max-width: 90%;
            min-height: 380px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            top: 50%;
            transform: translateY(-50%);
            padding: 40px 20px;
        }

        .modal .winner {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 52px;
            text-align: center;
            color: #111;
            line-height: 1.2;
        }

        .modal .winner span {
            display: block;
            font-size: 22px;
            color: #666;
            margin-top: 12px;
            font-family: Arial, sans-serif;
            font-weight: normal;
            letter-spacing: 0;
        }

        @media (max-width: 480px) {
            .modal .winner { font-size: 32px; }
            .modal .winner span { font-size: 16px; }
        }

        .modal .restart {
            margin: 30px auto;
            padding: 14px 36px;
            display: block;
            font-size: 20px;
            border: 1.5px solid #111;
            background: #111;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }

        .modal .restart:hover { background: #333; }
    </style>

</head>

<body>
    <div class="wrap">
        <div class="game"></div>
        <div class="modal-overlay">
            <div class="modal">
                <h2 class="winner">All matched!<span>You found every animal. Well played!</span></h2>
                <button class="restart">Play again?</button>
            </div>
        </div>
    </div>

    <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
    <script>
        (function () {
            var Memory = {
                init: function (cards) {
                    this.$game = $(".game");
                    this.$modal = $(".modal");
                    this.$overlay = $(".modal-overlay");
                    this.$restartButton = $("button.restart");
                    this.cardsArray = $.merge(cards, cards);
                    this.shuffleCards(this.cardsArray);
                    this.setup();
                },
                shuffleCards: function (cardsArray) {
                    this.$cards = $(this.shuffle(this.cardsArray));
                },
                setup: function () {
                    this.html = this.buildHTML();
                    this.$game.html(this.html);
                    this.$memoryCards = $(".card");
                    this.paused = false;
                    this.guess = null;
                    this.binding();
                },
                binding: function () {
                    this.$memoryCards.on("click", this.cardClicked);
                    this.$restartButton.on("click", $.proxy(this.reset, this));
                },
                cardClicked: function () {
                    var _ = Memory;
                    var $card = $(this);
                    if (!_.paused && !$card.find(".inside").hasClass("matched") && !$card.find(".inside").hasClass("picked")) {
                        $card.find(".inside").addClass("picked");
                        if (!_.guess) {
                            _.guess = $(this).attr("data-id");
                        } else if (_.guess == $(this).attr("data-id") && !$(this).hasClass("picked")) {
                            $(".picked").addClass("matched");
                            _.guess = null;
                        } else {
                            _.guess = null;
                            _.paused = true;
                            setTimeout(function () {
                                $(".picked").removeClass("picked");
                                Memory.paused = false;
                            }, 600);
                        }
                        if ($(".matched").length == $(".card").length) { _.win(); }
                    }
                },
                win: function () {
                    this.paused = true;
                    setTimeout(function () {
                        Memory.showModal();
                        Memory.$game.fadeOut();
                    }, 1000);
                },
                showModal: function () {
                    this.$overlay.show();
                    this.$modal.fadeIn("slow");
                },
                hideModal: function () {
                    this.$overlay.hide();
                    this.$modal.hide();
                },
                reset: function () {
                    this.hideModal();
                    this.shuffleCards(this.cardsArray);
                    this.setup();
                    this.$game.show("slow");
                },
                shuffle: function (array) {
                    var counter = array.length, temp, index;
                    while (counter > 0) {
                        index = Math.floor(Math.random() * counter);
                        counter--;
                        temp = array[counter];
                        array[counter] = array[index];
                        array[index] = temp;
                    }
                    return array;
                },
                buildHTML: function () {
                    var frag = '';
                    this.$cards.each(function (k, v) {
                        frag += '<div class="card" data-id="' + v.id + '"><div class="inside">' +
                            '<div class="front"><img src="' + v.img + '" alt="' + v.name + '" /></div>' +
                            '<div class="back"><span class="back-label">Animals</span></div>' +
                            '</div></div>';
                    });
                    return frag;
                }
            };

            var cards = [
                {
                    name: "Lion",
                    img: "https://images.pexels.com/photos/247502/pexels-photo-247502.jpeg?auto=compress&cs=tinysrgb&w=800",
                    id: 1
                },
                {
                    name: "Tiger",
                    img: "https://images.pexels.com/photos/145939/pexels-photo-145939.jpeg?auto=compress&cs=tinysrgb&w=800",
                    id: 2
                },
                {
                    name: "Elephant",
                    img: "https://images.pexels.com/photos/66898/elephant-cub-tsavo-kenya-66898.jpeg?auto=compress&cs=tinysrgb&w=800",
                    id: 3
                },
                {
                    name: "Zebra",
                    img: "https://images.pexels.com/photos/750539/pexels-photo-750539.jpeg?auto=compress&cs=tinysrgb&w=800",
                    id: 4
                },
                {
                    name: "Giraffe",
                    img: "https://animals.sandiegozoo.org/sites/default/files/2016-11/animals_hero_giraffe_1_0.jpg",
                    id: 5
                },
                {
                    name: "Panda",
                    img: "https://images.pexels.com/photos/3608263/pexels-photo-3608263.jpeg?auto=compress&cs=tinysrgb&w=800",
                    id: 6
                },
                {
                    name: "Koala",
                    img: "https://media.hswstatic.com/eyJidWNrZXQiOiJjb250ZW50Lmhzd3N0YXRpYy5jb20iLCJrZXkiOiJnaWZcL2tvYWxhcy0xLmpwZyIsImVkaXRzIjp7InJlc2l6ZSI6eyJ3aWR0aCI6IjEyMDAifX19",
                    id: 7
                },
                {
                    name: "Fox",
                    img: "https://images.pexels.com/photos/247373/pexels-photo-247373.jpeg?auto=compress&cs=tinysrgb&w=800",
                    id: 8
                },
                {
                    name: "Wolf",
                    img: "https://images.pexels.com/photos/236603/pexels-photo-236603.jpeg?auto=compress&cs=tinysrgb&w=800",
                    id: 9
                },
                {
                    name: "Owl",
                    img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQHV_xANXIbhmPU3yu9GFOVTjY8miTr3PdyPQ&s",
                    id: 10
                },
                {
                    name: "Penguin",
                    img: "https://res.cloudinary.com/enchanting/q_70,f_auto,c_fill,g_face/quark-web/2024/09/King_Penguin_michellesole-4742.jpg",
                    id: 11
                },
                {
                    name: "Dolphin",
                    img: "https://www.bornfree.org.uk/wp-content/uploads/2023/09/bottlenose-dolphin-iStock.jpg",
                    id: 12
                }
            ];

            Memory.init(cards);
        })();
    </script>

</body>
</html>
