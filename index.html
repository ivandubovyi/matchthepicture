<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Match The Animals</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: black;
            min-height: 100%;
            font-family: "Arial", sans-serif;
        }

        .wrap {
            position: relative;
            height: 100%;
            min-height: 500px;
            padding-bottom: 20px;
        }

        .game {
            transform-style: preserve-3d;
            perspective: 500px;
            min-height: 100%;
            height: 100%;
        }

        .card {
            float: left;
            width: 16.66666%;
            height: 25%;
            padding: 5px;
            text-align: center;
            display: block;
            perspective: 500px;
            position: relative;
            cursor: pointer;
            z-index: 50;
        }

        @media (max-width: 800px) {
            .card {
                width: 25%;
                height: 16.666%;
            }
        }

        .card .inside {
            width: 100%;
            height: 100%;
            display: block;
            transform-style: preserve-3d;
            transition: 0.4s ease-in-out;
            background: white;
        }

        .card .front,
        .card .back {
            border: 1px solid black;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        .card .front img,
        .card .back img {
            max-width: 100%;
            display: block;
            margin: 0 auto;
            max-height: 100%;
        }

        .card .front {
            transform: rotateY(-180deg);
        }

        @media (max-width: 800px) {
            .card .front {
                padding: 5px;
            }

            .card .back {
                padding: 10px;
            }
        }

        .card .inside.picked,
        .card .inside.matched {
            transform: rotateY(180deg);
        }

        @keyframes matchAnim {
            0% {
                background: #bcffcc;
            }

            100% {
                backgroud: white;
            }
        }

        @-webkit-keyframes matchAnim {
            0% {
                background: #bcffcc;
            }

            100% {
                background: white;
            }
        }

        .card .inside.matched {
            -webkit-animation: 1s matchAnim ease-in-out;
            animation: 1s matchAnim ease-in-out;
            -webkit-animation-delay: 0.4s;
            animation-delay: 0.4s;
        }

        .modal-overlay {
            display: none;
            background: rgba(0, 0, 0, 0.8);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .modal {
            display: none;
            position: relative;
            width: 1000px;
            height: 300px;
            max-height: 90%;
            max-width: 90%;
            min-height: 380px;
            margin: 0 auto;
            background: white;
            top: 50%;
            transform: translateY(-50%);
            padding: 30px 10px;
        }

        .modal .winner {
            font-size: 80px;
            text-align: center;
            color: #4d4d4d;
            text-shadow: 0px 3px 0 black;
        }

        @media (max-width: 480px) {
            .modal .winner {
                font-size: 60px;
            }
        }

        .modal .restart {
            margin: 30px auto;
            padding: 20px 30px;
            display: block;
            font-size: 30px;
            border: none;
            background: #4d4d4d;
            background: linear-gradient(#4d4d4d, #222);
            border: 1px solid #222;
            border-radius: 5px;
            color: white;
            text-shadow: 0px 1px 0 black;
            cursor: pointer;
        }

        .modal .restart:hover {
            background: linear-gradient(#222, black);
        }

        .modal .message {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="game"></div>

        <div class="modal-overlay">
            <div class="modal">
                <h2 class="winner">Victory! Congrats, you won the Match The Animals game!</h2>
                <button class="restart">Play again?</button>
            </div>
        </div>
    </div>

    <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
    <script>
        (function () {

            var Memory = {

                init: function (cards) {
                    this.$game = $(".game");
                    this.$modal = $(".modal");
                    this.$overlay = $(".modal-overlay");
                    this.$restartButton = $("button.restart");
                    this.cardsArray = $.merge(cards, cards);
                    this.shuffleCards(this.cardsArray);
                    this.setup();
                },

                shuffleCards: function (cardsArray) {
                    this.$cards = $(this.shuffle(this.cardsArray));
                },

                setup: function () {
                    this.html = this.buildHTML();
                    this.$game.html(this.html);
                    this.$memoryCards = $(".card");
                    this.paused = false;
                    this.guess = null;
                    this.binding();
                },

                binding: function () {
                    this.$memoryCards.on("click", this.cardClicked);
                    this.$restartButton.on("click", $.proxy(this.reset, this));
                },

                cardClicked: function () {
                    var _ = Memory;
                    var $card = $(this);
                    if (!_.paused && !$card.find(".inside").hasClass("matched") && !$card.find(".inside").hasClass("picked")) {
                        $card.find(".inside").addClass("picked");
                        if (!_.guess) {
                            _.guess = $(this).attr("data-id");
                        } else if (_.guess == $(this).attr("data-id") && !$(this).hasClass("picked")) {
                            $(".picked").addClass("matched");
                            _.guess = null;
                        } else {
                            _.guess = null;
                            _.paused = true;
                            setTimeout(function () {
                                $(".picked").removeClass("picked");
                                Memory.paused = false;
                            }, 600);
                        }
                        if ($(".matched").length == $(".card").length) {
                            _.win();
                        }
                    }
                },

                win: function () {
                    this.paused = true;
                    setTimeout(function () {
                        Memory.showModal();
                        Memory.$game.fadeOut();
                    }, 1000);
                },

                showModal: function () {
                    this.$overlay.show();
                    this.$modal.fadeIn("slow");
                },

                hideModal: function () {
                    this.$overlay.hide();
                    this.$modal.hide();
                },

                reset: function () {
                    this.hideModal();
                    this.shuffleCards(this.cardsArray);
                    this.setup();
                    this.$game.show("slow");
                },

                shuffle: function (array) {
                    var counter = array.length, temp, index;
                    while (counter > 0) {
                        index = Math.floor(Math.random() * counter);
                        counter--;
                        temp = array[counter];
                        array[counter] = array[index];
                        array[index] = temp;
                    }
                    return array;
                },

                buildHTML: function () {
                    var frag = '';
                    this.$cards.each(function (k, v) {
                        frag += '<div class="card" data-id="' + v.id + '"><div class="inside">\
                <div class="front"><img src="' + v.img + '"\
                alt="' + v.name + '" /></div>\
                <div class="back"><img src="https://static.vecteezy.com/system/resources/previews/000/371/240/original/calligraphic-quote-wedding-day-vector-text-on-white-background.jpg"\
                alt="Card Back" /></div></div>\
                </div>';
                    });
                    return frag;
                }
            };

            var cards = [
                {
                    name: "Lion",
                    img: "https://images.unsplash.com/photo-1546182990-dffeafbe841d?auto=format&fit=crop&w=800&q=80",
                    id: 1
                },
                {
                    name: "Tiger",
                    img: "https://images.unsplash.com/photo-1549366021-9f761d450615?auto=format&fit=crop&w=800&q=80",
                    id: 2
                },
                {
                    name: "Elephant",
                    img: "https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?auto=format&fit=crop&w=800&q=80",
                    id: 3
                },
                {
                    name: "Zebra",
                    img: "https://images.unsplash.com/photo-1526318472351-c75fcf070305?auto=format&fit=crop&w=800&q=80",
                    id: 4
                },
                {
                    name: "Giraffe",
                    img: "https://images.unsplash.com/photo-1547036967-23d11aacaee0?auto=format&fit=crop&w=800&q=80",
                    id: 5
                },
                {
                    name: "Panda",
                    img: "https://images.unsplash.com/photo-1564349683136-77e08dba1ef7?auto=format&fit=crop&w=800&q=80",
                    id: 6
                },
                {
                    name: "Koala",
                    img: "https://images.unsplash.com/photo-1520808663317-647b476a81b9?auto=format&fit=crop&w=800&q=80",
                    id: 7
                },
                {
                    name: "Fox",
                    img: "https://images.unsplash.com/photo-1474511320723-9a56873867b5?auto=format&fit=crop&w=800&q=80",
                    id: 8
                },
                {
                    name: "Wolf",
                    img: "https://images.unsplash.com/photo-1474511016488-0067309c4c28?auto=format&fit=crop&w=800&q=80",
                    id: 9
                },
                {
                    name: "Owl",
                    img: "https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=800&q=80",
                    id: 10
                },
                {
                    name: "Penguin",
                    img: "https://images.unsplash.com/photo-1551986782-d0169b3f8fa7?auto=format&fit=crop&w=800&q=80",
                    id: 11
                },
                {
                    name: "Dolphin",
                    img: "https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=800&q=80",
                    id: 12
                }
            ];

            Memory.init(cards);

        })();
    </script>

</body>

</html>
